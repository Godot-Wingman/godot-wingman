# Publishes a release when a version tag is pushed, for example: git tag v0.4.0 && git push --tags
# Builds one executable per platform and a zip of the Godot addon.
# The Windows executable is built on Windows, because only there can Bun write its file
# details (product name, description, version).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build -- windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows-executable
          path: dist/godot-wingman-windows-x64.exe
          if-no-files-found: error

  release:
    needs: windows-executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint && bun run typecheck && bun run test:unit
      - run: bun run build -- without-windows
      - uses: actions/download-artifact@v8
        with:
          name: windows-executable
          path: dist
      - name: Zip the addon for manual installation
        run: cd addon && zip -r ../dist/godot-wingman-addon.zip godot_wingman
      - name: Write checksums (the update command checks downloads against them)
        run: cd dist && sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=""
          # Versions below 1.0 are pre-releases.
          if [[ "${GITHUB_REF_NAME}" == v0.* ]]; then prerelease_flag="--prerelease"; fi
          # docs/release-notes/<tag>.md gives the title (its first line) and the top of the
          # text; get-it.md and GitHub's commit list follow it.
          notes_source="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "${notes_source}" ]]; then
            release_title="${GITHUB_REF_NAME} · $(head -n 1 "${notes_source}" | sed 's/^# //')"
            notes_file="${RUNNER_TEMP}/release-notes.md"
            { tail -n +2 "${notes_source}"; echo; cat docs/release-notes/get-it.md; } > "${notes_file}"
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${release_title}" --notes-file "${notes_file}" --generate-notes ${prerelease_flag}
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes ${prerelease_flag}
          fi
