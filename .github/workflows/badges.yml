# Refreshes the live README badges (release, tests, stars).
# GitHub's image proxy often times out on shields.io and then shows a broken image, so this
# workflow downloads the badges itself and keeps them as SVG files on the "badges" branch,
# which holds only that one commit. The READMEs load them from raw.githubusercontent.com.
name: Badges

on:
  schedule:
    - cron: "41 */6 * * *"
  push:
    branches: [main]
  release:
    types: [published]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Download the badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repository="${GITHUB_REPOSITORY}"
          # The same colors as the fixed badges in docs/images/badges.
          style="style=for-the-badge&labelColor=2b3137&logoColor=white&color=478cbf"
          mkdir badges
          download_badge() {
            curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 60 \
              --output "badges/$1.svg" "$2"
          }
          # The newest CI run on main that really finished: a run cancelled by a newer push
          # says nothing about the code, so it must not turn the badge into "failing".
          tests_result=$(gh run list --repo "${repository}" --workflow ci.yml --branch main --status completed --limit 20 \
            --json conclusion --jq 'map(select(.conclusion == "success" or .conclusion == "failure"))[0].conclusion')
          if [[ "${tests_result}" == "failure" ]]; then tests_badge="failing-e5534b"; else tests_badge="passing-478cbf"; fi
          download_badge release "https://img.shields.io/github/v/release/${repository}?include_prereleases&${style}&logo=github&label=release"
          download_badge tests "https://img.shields.io/badge/tests-${tests_badge}?style=for-the-badge&labelColor=2b3137&logoColor=white&logo=githubactions"
          download_badge stars "https://img.shields.io/github/stars/${repository}?${style}&logo=github"
      - name: Replace the badges branch with the new files
        run: |
          cd badges
          git init --quiet --initial-branch=badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit --quiet --message "Refresh the README badges"
          git push --force --quiet "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" badges
