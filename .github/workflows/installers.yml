# Checks that the one-line installers (install/) download, verify and run the newest
# release on Windows, macOS and Linux, both ways: the small bundle run by Bun (Bun is
# installed when missing) and the single-file program. Runs when they change, and by hand.
name: Installers

on:
  push:
    branches: [main]
    paths: ["install/**", ".github/workflows/installers.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: install.sh (${{ matrix.os }}, ${{ matrix.kind }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        kind: [bundle, executable]
    steps:
      - uses: actions/checkout@v7
      - name: Install into a temporary folder
        run: sh install/install.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GODOT_WINGMAN_INSTALL_DIR: ${{ runner.temp }}/godot-wingman
          GODOT_WINGMAN_NO_SETUP: "1"
          GODOT_WINGMAN_USE_EXECUTABLE: ${{ matrix.kind == 'executable' && '1' || '' }}
      - name: The installed command runs
        run: '"$RUNNER_TEMP/godot-wingman/godot-wingman" --version'
      - name: The bundle is installed only when Bun runs it
        run: |
          if [ "${{ matrix.kind }}" = "bundle" ]; then
            test -f "$RUNNER_TEMP/godot-wingman/godot-wingman.js"
          else
            test ! -e "$RUNNER_TEMP/godot-wingman/godot-wingman.js"
          fi

  windows:
    name: install.ps1 (windows-latest, ${{ matrix.kind }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [bundle, executable]
    steps:
      - uses: actions/checkout@v7
      - name: Install into a temporary folder (Windows PowerShell 5.1)
        shell: powershell
        run: ./install/install.ps1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GODOT_WINGMAN_INSTALL_DIR: ${{ runner.temp }}\godot-wingman
          GODOT_WINGMAN_NO_SETUP: "1"
          GODOT_WINGMAN_USE_EXECUTABLE: ${{ matrix.kind == 'executable' && '1' || '' }}
      - name: The installed command runs
        shell: cmd
        run: '"%RUNNER_TEMP%\godot-wingman\godot-wingman" --version'
      - name: The bundle is installed only when Bun runs it
        shell: powershell
        run: |
          $BundleExists = Test-Path "$env:RUNNER_TEMP\godot-wingman\godot-wingman.js"
          if (("${{ matrix.kind }}" -eq "bundle") -ne $BundleExists) { throw "Wrong kind of install." }
