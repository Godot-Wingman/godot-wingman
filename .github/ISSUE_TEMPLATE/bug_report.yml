name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you or the AI do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: tool-call
    attributes:
      label: Tool call and result
      description: The tool name, its arguments and the error text, if you have them.
      render: text
  - type: input
    id: godot-pilot-version
    attributes:
      label: Godot Pilot version
      description: Output of `godot-pilot --version`.
    validations:
      required: true
  - type: input
    id: godot-version
    attributes:
      label: Godot version
      placeholder: 4.7.2-stable, .NET or standard build
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04...
    validations:
      required: true
  - type: input
    id: ai-client
    attributes:
      label: AI client
      placeholder: Claude Code, Claude Desktop, Cursor, VS Code...
