name: Feature request
description: Something a person can do in Godot that the AI cannot do yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What should the AI be able to do?
      description: Describe the task the way you would do it by hand in the Godot editor.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today?
      description: Can the AI do it with execute_editor_script? Is it slow, unreliable or impossible?
  - type: textarea
    id: idea
    attributes:
      label: Ideas for the tool
      description: Optional. Tool name, inputs, which toolset it belongs to.
