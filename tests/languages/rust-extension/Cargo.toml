# A tiny GDExtension written in Rust (godot-rust), used by tests/languages/gdextension.test.ts
# to check that Godot Wingman sees and uses classes that extensions add.
[package]
name = "wingman_extension"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = ">=0.3"
